<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SalsalDay TimeStamp</title>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>

<style>
:root { --bg:#0f0f10; --panel:#17181a; --text:#e9e9ea; --muted:#a8a8ab; }
body { margin:0; font-family: system-ui,-apple-system; background:var(--bg); color:var(--text);}
.wrap { display:grid; grid-template-columns:360px 1fr; gap:16px; padding:16px;}
@media (max-width:900px){ .wrap{grid-template-columns:1fr;} }
.card{background:var(--panel);border:1px solid #2a2b2f;border-radius:14px;padding:14px;}
h1{margin:0 0 16px;font-size:18px;}
.row{display:flex;gap:10px;align-items:center;margin:10px 0;}
.row>label{flex:0 0 120px;color:var(--muted);font-size:13px;}
input[type="file"],select,input[type="datetime-local"]{
width:100%;background:#0f1012;color:var(--text);
border:1px solid #2a2b2f;border-radius:10px;padding:8px;}
input[type="color"]{width:44px;height:32px;border:none;background:transparent;}
input[type="range"]{width:100%;}
button{flex:1;border:1px solid #2a2b2f;background:#0f1012;color:var(--text);
border-radius:12px;padding:10px;cursor:pointer;}
button.primary{background:#1f6feb;border-color:#1f6feb;}
.stage{display:flex;justify-content:center;align-items:center;min-height:60vh;}
canvas{max-width:100%;border-radius:14px;border:1px solid #2a2b2f;}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px;}
</style>
</head>

<body>
<div class="wrap">
<section class="card">
<h1>SalsalDay TimeStamp</h1>

<div class="row">
<label>사진</label>
<input id="photoInput" type="file" accept="image/*">
</div>

<div class="row">
<label>시간모드</label>
<select id="timeMode">
<option value="exif">사진 촬영시간(EXIF)</option>
<option value="manual">직접 지정</option>
</select>
</div>

<div class="row">
<label>스탬프 시간</label>
<input id="manualTime" type="datetime-local">
</div>

<div class="row">
<label>텍스트색</label>
<input id="textColor" type="color" value="#ffffff">
</div>

<div class="row">
<label>배경색</label>
<input id="boxColor" type="color" value="#000000">
</div>

<div class="row">
<label>투명도</label>
<input id="boxAlpha" type="range" min="0" max="100" value="65">
</div>

<div class="row">
<label>로고 크기</label>
<input id="logoScale" type="range" min="5" max="25" value="12">
</div>

<div style="display:flex;gap:10px;margin-top:12px;">
<button id="applyBtn" class="primary">스탬프 적용</button>
<button id="downloadBtn">다운로드</button>
</div>

<div class="hint">(c) 2026. SalsalDay Co. All rights reserved.</div>
</section>

<section class="card">
<div class="stage">
<canvas id="cv"></canvas>
</div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$("cv");
const ctx=cv.getContext("2d",{colorSpace:"display-p3"});

const LOGO_URL="https://raw.githubusercontent.com/salsalday/salsalday/refs/heads/main/salsalday_logo.png";

let baseImg=null;
let logoImg=new Image();
logoImg.src=LOGO_URL+"?v="+Date.now();

let exifDate=null;
let finalBlob=null;

$("photoInput").addEventListener("change",async e=>{
const file=e.target.files[0];
if(!file)return;

const url=URL.createObjectURL(file);
const img=new Image();
img.onload=()=>{
baseImg=img;
cv.width=img.naturalWidth;
cv.height=img.naturalHeight;
ctx.drawImage(img,0,0);
};
img.src=url;

const exif=await exifr.parse(file,{tiff:true,exif:true});
exifDate=exif?.DateTimeOriginal||null;
});

$("applyBtn").addEventListener("click",async()=>{
if(!baseImg)return alert("사진 먼저 업로드!");

ctx.clearRect(0,0,cv.width,cv.height);
ctx.drawImage(baseImg,0,0);

let d;
if($("timeMode").value==="exif"&&exifDate){
d=exifDate;
}else{
if(!$("manualTime").value)return alert("시간 선택!");
d=new Date($("manualTime").value);
}

const days=["일","월","화","수","목","금","토"];
const yyyy=d.getFullYear();
const mm=String(d.getMonth()+1).padStart(2,"0");
const dd=String(d.getDate()).padStart(2,"0");
const day=days[d.getDay()];
let hh=d.getHours();
const ampm=hh>=12?"PM":"AM";
hh=hh%12;if(hh===0)hh=12;
const min=String(d.getMinutes()).padStart(2,"0");

const line1=`${yyyy}.${mm}.${dd}(${day})`;
const line2=`${String(hh).padStart(2,"0")}:${min} ${ampm}`;

const pad=cv.width*0.03;
const fontSize=cv.width*0.05;

ctx.font=`bold ${fontSize}px monospace`;
const textW=Math.max(ctx.measureText(line1).width,ctx.measureText(line2).width);
const boxW=textW+fontSize*1.5;
const boxH=fontSize*2+fontSize;

const x=pad;
const y=cv.height-pad-boxH;

const bg=$("boxColor").value;
const alpha=$("boxAlpha").value/100;
ctx.fillStyle=hexToRGBA(bg,alpha);
ctx.fillRect(x,y,boxW,boxH);

ctx.fillStyle=$("textColor").value;
ctx.fillText(line1,x+fontSize*0.7,y+fontSize*0.4);
ctx.fillText(line2,x+fontSize*0.7,y+fontSize*1.4);

const logoSize=cv.width*($("logoScale").value/100);
ctx.drawImage(logoImg,cv.width-logoSize-pad,cv.height-logoSize-pad,logoSize,logoSize);

finalBlob=await compressUnder20MB();
alert("스탬프 완료 + 블로그모드 압축 적용!");
});

$("downloadBtn").addEventListener("click",async()=>{
if(!finalBlob)return alert("먼저 스탬프 적용!");

const now=new Date();
const filename=`SalsalDay_${now.getFullYear()}${now.getMonth()+1}${now.getDate()}.jpg`;

const file=new File([finalBlob],filename,{type:"image/jpeg"});

if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
await navigator.share({files:[file]});
return;
}

const url=URL.createObjectURL(finalBlob);
window.open(url,"_blank");
});

function hexToRGBA(hex,a){
const r=parseInt(hex.substr(1,2),16);
const g=parseInt(hex.substr(3,2),16);
const b=parseInt(hex.substr(5,2),16);
return`rgba(${r},${g},${b},${a})`;
}

async function compressUnder20MB(){
const MAX=20*1024*1024;
const qualities=[0.92,0.88,0.85,0.82];
for(const q of qualities){
const blob=await canvasToBlob("image/jpeg",q);
if(blob.size<MAX)return blob;
}
const scale=0.85;
const temp=document.createElement("canvas");
temp.width=cv.width*scale;
temp.height=cv.height*scale;
temp.getContext("2d").drawImage(cv,0,0,temp.width,temp.height);
return await new Promise(res=>temp.toBlob(res,"image/jpeg",0.85));
}

function canvasToBlob(type,quality){
return new Promise(res=>cv.toBlob(res,type,quality));
}
</script>
</body>
</html>
