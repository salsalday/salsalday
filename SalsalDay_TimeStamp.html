<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SalsalDay TimeStamp</title>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>

<style>
  :root { --bg:#0f0f10; --panel:#17181a; --text:#e9e9ea; --muted:#a8a8ab; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { display:grid; grid-template-columns: 360px 1fr; gap:16px; padding:16px; }
  @media (max-width: 900px){ .wrap{ grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid #2a2b2f; border-radius:14px; padding:14px; }
  h1{ font-size:18px; margin:0 0 16px; font-weight:600; }
  .row{ display:flex; gap:10px; align-items:center; margin:10px 0; }
  .row > label{ flex: 0 0 120px; color:var(--muted); font-size:13px; }
  input[type="file"]{ width:100%; }
  input[type="color"]{ width:44px; height:32px; border:none; background:transparent; }
  input[type="range"]{ width:100%; }
  select, input[type="datetime-local"]{
    width:100%; background:#0f1012; color:var(--text);
    border:1px solid #2a2b2f; border-radius:10px; padding:10px;
    outline:none;
  }
  .btns{ display:flex; gap:10px; margin-top:16px; }
  button{
    border:1px solid #2a2b2f; background:#0f1012; color:var(--text);
    border-radius:12px; padding:12px 14px; cursor:pointer; flex:1;
  }
  button.primary{ background:#1f6feb; border-color:#1f6feb; }
  .hint{ color:var(--muted); font-size:12px; line-height:1.4; margin-top:16px; text-align:center; }
  .stage{ display:flex; justify-content:center; align-items:center; min-height:60vh; }
  canvas{ max-width:100%; height:auto; border-radius:14px; border:1px solid #2a2b2f; background:#000; }
  .tiny{ font-size:12px; color:var(--muted); }
  .grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .grid .row > label{ flex: 0 0 72px; }
  .grid input[type="color"]{ flex: 0 0 44px; width:44px; min-width:44px; }
  .badge {
    display:inline-block; padding:6px 10px; border-radius:999px;
    background:#0f1012; border:1px solid #2a2b2f; color:var(--muted);
    font-size:12px;
  }
</style>
</head>

<body>
<div class="wrap">
  <section class="card">
    <h1>SalsalDay TimeStamp</h1>

    <div class="row">
      <label>사진 업로드</label>
      <input id="photoInput" type="file" accept="image/*" />
    </div>

    <div class="row">
      <label>로고</label>
      <div style="width:100%; display:flex; gap:10px; align-items:center;">
        <span class="badge" id="logoStatus">로고 로딩 중…</span>
      </div>
    </div>

    <div class="row">
      <label>시간 모드</label>
      <select id="timeMode">
        <option value="manual">직접 지정</option>
        <option value="exif">사진 촬영시간(EXIF)</option>
      </select>
    </div>

    <div class="row">
      <label>스탬프 시간</label>
      <input id="manualTime" type="datetime-local" />
    </div>

    <div class="row">
      <label></label>
      <button id="setNowBtn">지금 시간 넣기</button>
    </div>

    <div class="row">
      <label>촬영시간</label>
      <span class="badge" id="exifBadge">아직 없음</span>
    </div>

    <div class="grid">
      <div class="row">
        <label>텍스트</label>
        <input id="textColor" type="color" value="#ffffff" />
      </div>
      <div class="row">
        <label>배경</label>
        <input id="boxColor" type="color" value="#000000" />
      </div>
    </div>

    <div class="row">
      <label>배경 투명도</label>
      <input id="boxAlpha" type="range" min="0" max="100" value="65" />
    </div>

    <div class="row">
      <label>위치</label>
      <select id="position">
        <option value="bl">좌하단</option>
        <option value="br">우하단</option>
        <option value="tl">좌상단</option>
        <option value="tr">우상단</option>
      </select>
    </div>

    <div class="row">
      <label>로고 크기</label>
      <input id="logoScale" type="range" min="5" max="30" value="14" />
    </div>

    <div class="row">
      <label>폰트 크기</label>
      <input id="fontScale" type="range" min="2" max="10" value="5" />
    </div>

    <div class="btns">
      <button id="applyBtn" class="primary">스탬프 적용</button>
      <button id="downloadBtn">다운로드</button>
    </div>

    <div class="hint">
      (c) 2026. SalsalDay Co. All rights reserved.
    </div>
  </section>

  <section class="card">
    <div class="tiny" id="status">사진을 업로드하면 미리보기가 뜸.</div>
    <div class="stage">
      <canvas id="cv"></canvas>
    </div>
  </section>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const LOGO_URL = "https://raw.githubusercontent.com/salsalday/salsalday/refs/heads/main/salsalday_logo.png";

  const photoInput = $("photoInput");
  const logoStatus = $("logoStatus");
  const timeMode = $("timeMode");
  const manualTime = $("manualTime");
  const setNowBtn = $("setNowBtn");
  const exifBadge = $("exifBadge");
  const textColor = $("textColor");
  const boxColor = $("boxColor");
  const boxAlpha = $("boxAlpha");
  const position = $("position");
  const logoScale = $("logoScale");
  const fontScale = $("fontScale");
  const applyBtn = $("applyBtn");
  const downloadBtn = $("downloadBtn");
  const statusEl = $("status");
  const cv = $("cv");
  const ctx = cv.getContext("2d");

  let baseImg = null;
  let logoImg = null;
  let exifDate = null;
  let lastRenderedDataUrl = null;

  setManualTimeToNow();
  syncTimeModeUI();
  loadLogo();

  function syncTimeModeUI(){
    const isExif = timeMode.value === "exif";
    manualTime.disabled = isExif;
    setNowBtn.disabled = isExif;
  }

  timeMode.addEventListener("change", syncTimeModeUI);
  setNowBtn.addEventListener("click", () => {
    setManualTimeToNow();
    timeMode.value = "manual";
    syncTimeModeUI();
  });

  function setManualTimeToNow(){
    const d = new Date();
    const yyyy = d.getFullYear();
    const MM = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    const HH = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    manualTime.value = `${yyyy}-${MM}-${dd}T${HH}:${mm}`;
  }

  async function loadLogo(){
    try{
      const res = await fetch(LOGO_URL + "?v=" + Date.now());
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        logoImg = img;
        logoStatus.textContent = "로고 로드 완료";
      };
      img.src = url;
    }catch{
      logoStatus.textContent = "로고 로드 실패";
    }
  }

  photoInput.addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      baseImg = img;
      cv.width = img.naturalWidth;
      cv.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      statusEl.textContent = `업로드 완료`;
    };
    img.src = url;

    exifDate = await exifr.parse(file).then(d => d?.DateTimeOriginal || null);
    exifBadge.textContent = exifDate ? formatStamp(exifDate) : "촬영정보 없음";
  });

  applyBtn.addEventListener("click", () => {
    if (!baseImg || !logoImg) return alert("사진 또는 로고 준비 안됨");

    const d = timeMode.value === "exif" ? exifDate : new Date(manualTime.value);
    if (!d) return alert("시간 정보 없음");

    renderStamp(baseImg, logoImg, formatStamp(d));
    lastRenderedDataUrl = cv.toDataURL("image/jpeg", 0.92);
  });

  downloadBtn.addEventListener("click", async () => {
    if (!lastRenderedDataUrl) return alert("먼저 스탬프 적용해줘");

    const blob = await (await fetch(lastRenderedDataUrl)).blob();
    const file = new File([blob], "SalsalDay.jpg", { type: "image/jpeg" });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
    } else {
      const a = document.createElement("a");
      a.href = lastRenderedDataUrl;
      a.download = "SalsalDay.jpg";
      a.click();
    }
  });

  function formatStamp(d) {
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    let hh = d.getHours();
    const ampm = hh >= 12 ? "PM" : "AM";
    hh = hh % 12;
    if (hh === 0) hh = 12;
    const min = String(d.getMinutes()).padStart(2, "0");
    const hh2 = String(hh).padStart(2, "0");
    return `${mm}.${dd} ${hh2}:${min} ${ampm}`;
  }

  function renderStamp(img, logo, stampText){
    const W = img.naturalWidth;
    const H = img.naturalHeight;
    cv.width = W;
    cv.height = H;
    ctx.drawImage(img, 0, 0);

    const fontPx = W * (fontScale.value / 100);
    ctx.font = `600 ${fontPx}px monospace`;
    const textW = ctx.measureText(stampText).width;

    const pad = W * 0.03;
    const boxPad = fontPx * 0.7;
    const boxW = textW + boxPad * 2;
    const boxH = fontPx + boxPad;

    const x = pad;
    const y = H - pad - boxH;

    const bg = boxColor.value;
    ctx.fillStyle = bg;
    ctx.globalAlpha = boxAlpha.value / 100;
    ctx.fillRect(x, y, boxW, boxH);
    ctx.globalAlpha = 1;

    ctx.fillStyle = textColor.value;
    ctx.textBaseline = "middle";
    ctx.fillText(stampText, x + boxPad, y + boxH / 2);

    const logoSize = W * (logoScale.value / 100);
    ctx.drawImage(logo, W - pad - logoSize, H - pad - logoSize, logoSize, logoSize);
  }
</script>
</body>
</html>
